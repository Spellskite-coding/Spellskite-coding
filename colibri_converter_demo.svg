<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="cc-win"><rect width="700" height="420" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#cc-win)">
    <rect width="700" height="420" fill="#faf9f7"/>
    <rect width="700" height="42" fill="#3fbfae"/>
    <rect x="14" y="9" width="24" height="24" rx="6" fill="#2fa192"/>
    <g transform="translate(26,21) scale(0.4)">
      <path d="M -10,-6 Q 20,-42 42,-10 Q 14,-14 -10,-6 Z" fill="#ffffff" opacity="0.85"/>
      <ellipse cx="0" cy="0" rx="26" ry="18" fill="#ffffff"/>
      <circle cx="-28" cy="-8" r="12" fill="#ffffff"/>
      <path d="M -40,-8 L -62,-3 L -40,-2 Z" fill="#f2a6c2"/>
      <circle cx="-30" cy="-10" r="2" fill="#1a4a44"/>
    </g>
    <text x="360" y="26" font-size="14" fill="#ffffff" text-anchor="middle">Colibri Converter</text>

    <!-- drop zone -->
    <rect x="70" y="80" width="560" height="220" rx="16" fill="none" stroke="#3fbfae" stroke-width="2" stroke-dasharray="8 6"/>

    <!-- stylised hummingbird matching the teal/white logo -->
    <g transform="translate(350,168)">
      <path d="M 26,5 L 55,-6 L 55,16 Z" fill="#bfe8e2"/>
      <path d="M -10,-6 Q 20,-42 42,-10 Q 14,-14 -10,-6 Z" fill="#bfe8e2"/>
      <ellipse cx="0" cy="0" rx="26" ry="18" fill="#ffffff" stroke="#3fbfae" stroke-width="1.5"/>
      <circle cx="-28" cy="-8" r="12" fill="#ffffff" stroke="#3fbfae" stroke-width="1.5"/>
      <path d="M -40,-8 L -62,-3 L -40,-2 Z" fill="#f2a6c2"/>
      <circle cx="-30" cy="-10" r="2" fill="#1a4a44"/>
    </g>

    <text x="350" y="245" font-size="16" fill="#2f4f4a" text-anchor="middle">Glissez un fichier PDF ou DOCX ici</text>
    <text x="350" y="267" font-size="12" fill="#7a938e" text-anchor="middle">ou cliquez pour parcourir vos fichiers</text>

    <g transform="translate(240,290)">
      <rect width="70" height="28" rx="14" fill="#bfe8e2"/>
      <text x="35" y="19" font-size="12" text-anchor="middle" fill="#1a4a44" font-weight="bold">PDF</text>
    </g>
    <text x="350" y="309" font-size="16" fill="#7a938e" text-anchor="middle">&#8644;</text>
    <g transform="translate(390,290)">
      <rect width="70" height="28" rx="14" fill="#3fbfae"/>
      <text x="35" y="19" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">DOCX</text>
    </g>

    <rect x="285" y="335" width="130" height="34" rx="17" fill="#3fbfae"/>
    <text x="350" y="357" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">Convertir</text>

    <text x="350" y="400" font-size="11" fill="#9aada8" text-anchor="middle">100% local - aucune connexion requise - executable autonome</text>
  </g>
